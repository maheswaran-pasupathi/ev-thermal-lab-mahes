[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "evthermal"
version = "0.1.0"
description = "Physics-based EV road-load, energy and thermal-performance toolkit"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [
  {name = "Maheswaran Pasupathi"}
]
dependencies = [
  "numpy>=2.0,<3",
  "pandas>=2.2,<3"
]

[project.optional-dependencies]
app = ["streamlit>=1.40,<2", "plotly>=5.24,<7"]
test = ["pytest>=8.0,<9"]

[tool.setuptools.packages.find]
include = ["evthermal*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
